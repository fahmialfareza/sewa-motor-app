version: "2"
sql:
  - engine: "postgresql"
    schema: "sqlc/schema.sql"
    queries: "internal/adapter/postgres/queries"
    gen:
      go:
        package: "generated"
        out: "internal/adapter/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
