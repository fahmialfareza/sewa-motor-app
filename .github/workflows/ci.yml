name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sewa_motor_test
          POSTGRES_USER: sewa_motor
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sewa_motor -d sewa_motor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgres://sewa_motor:test-only-password@localhost:5432/sewa_motor_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      SESSION_TOKEN_PEPPER: ci-session-token-pepper-at-least-32-bytes
      TERMINAL_ENROLLMENT_SECRET: ci-terminal-enrollment-secret-32-bytes
      TZ: Asia/Jakarta
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose configuration
        run: pnpm compose:config

      - name: Lint OpenAPI
        run: pnpm openapi:lint

      - name: Detect generated-code drift
        run: pnpm generate:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build backend container targets
        run: |
          docker build --target api --tag sewa-motor-backend:ci-api apps/backend
          docker build --target migrate --tag sewa-motor-backend:ci-migrate apps/backend
          docker build --target bootstrap --tag sewa-motor-backend:ci-bootstrap apps/backend
